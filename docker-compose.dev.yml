services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file: .env.local
    environment:
      - OPTIMIZER_PROXY_TARGET=http://uma-optimizer:3001
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - dev-net
    depends_on:
      - uma-optimizer

  uma-optimizer:
    build:
      context: uma-optimizer
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env.local
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - RUST_LOG=uma_optimizer=debug,tower_http=debug
    networks:
      - dev-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  dev-net:

volumes:
  frontend_node_modules:
