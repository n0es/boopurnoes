[package]
name = "uma-optimizer"
version = "0.1.0"
edition = "2021"
description = "Uma Musume deck optimizer — standalone service with pluggable algorithms"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Randomness (for genetic algorithm + future Monte Carlo)
rand = "0.8"
rayon = "1.8"

# Streaming (SSE for live optimization updates)
tokio-stream = "0.1"
async-stream = "0.3"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# UUID for session IDs
uuid = { version = "1", features = ["v4", "serde"] }
